trigger:
  branches:
    include:
      - main
  paths:
    include:
      - WeatherService/**

# The server runs in the Azure Container App "container-app-weather" from the Docker Hub image
# judooctopus/weather-service. This pipeline checks the code and the Docker image still build.
# (It used to deploy to the App Service "grpc-weather-server", which no longer exists.)
# Deploying a new image is done by hand: see "Redeploy Server image after code change" in README2.md.
pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  clean: true

# 1. Build the C# server
- task: DotNetCoreCLI@2
  displayName: 'Build WeatherService'
  inputs:
    command: 'build'
    projects: 'WeatherService/WeatherService.csproj'
    arguments: '--configuration Release'

# 2. Build the Docker image the Container App runs (not pushed)
- script: docker build -t weather-service:$(Build.BuildId) WeatherService
  displayName: 'Build WeatherService Docker image'
